# Backend de onboarding (Postgres + visión biométrica + API Spring Boot).
# Construye desde las fuentes de addi/OnboardingAddi SIN modificarlas (solo se usan como contexto de build).
# El teléfono llega al backend por la IP del PC, puerto ${BACKEND_PORT:-8195}.

services:
  onboarding-postgres:
    image: postgres:16-alpine
    container_name: nw-onboarding-postgres
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ${ONBOARDING_DB_PASSWORD:-onboarding}
    ports:
      - "127.0.0.1:${ONBOARDING_DB_PORT:-5443}:5432"
    volumes:
      - nw_onboarding_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  onboarding-biometrics:
    build: ../../addi/OnboardingAddi/biometrics
    container_name: nw-onboarding-biometrics
    ports:
      - "127.0.0.1:${BIOMETRICS_PORT:-8200}:8100"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  onboarding-backend:
    build: ../../addi/OnboardingAddi/backend
    container_name: nw-onboarding-backend
    depends_on:
      onboarding-postgres:
        condition: service_healthy
      onboarding-biometrics:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://onboarding-postgres:5432/onboarding
      DB_USER: onboarding
      DB_PASSWORD: ${ONBOARDING_DB_PASSWORD:-onboarding}
      BIOMETRIC_HTTP_URL: http://onboarding-biometrics:8100
      OTP_PROVIDER: logging
      # SOLO desarrollo: la app completa el OTP sola con el código devuelto por la API.
      OTP_EXPOSE_CODE: ${OTP_EXPOSE_CODE:-true}
      OTP_HASH_PEPPER: ${OTP_HASH_PEPPER:-dev-pepper-change-me}
    ports:
      - "${BACKEND_PORT:-8195}:8095"
    volumes:
      - nw_onboarding_uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8095 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  nw_onboarding_pg:
  nw_onboarding_uploads:
