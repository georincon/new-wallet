global
    maxconn 2000
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    timeout connect 10s
    timeout client 150s
    timeout server 150s
    default_backend no-match

frontend nw
    bind 0.0.0.0:8447 ssl crt /etc/ssl/nw/newwallet.tls.pem
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    use_backend onboarding if { path_beg /onboarding/ }
    use_backend wallet-provider if { path_beg /wallet-provider/ } || { path /wallet-provider }

# Backend de onboarding (publicado en el host, puerto 8095). Se quita el prefijo /onboarding.
backend onboarding
    http-request set-path %[path,regsub(^/onboarding,)]
    server s1 host.docker.internal:8095

# New Wallet Provider (instancia propia). Se quita el prefijo /wallet-provider.
backend wallet-provider
    http-request set-path %[path,regsub(^/wallet-provider,)]
    server s1 newwallet-provider:8080

backend no-match
    http-request deny deny_status 404
